[project]
name = "pluggy-finance-mcp"
version = "0.1.0"
description = "Single-user, read-only Pluggy finance MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.28,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3", "pydantic-settings>=2.9,<3", "uvicorn>=0.35,<1", "simplejson>=3.20,<4"]

[project.scripts]
pluggy-finance-mcp = "pluggy_finance_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "mypy>=1.16", "types-simplejson", "pip-audit>=2.9", "openapi-spec-validator>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
